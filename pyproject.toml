[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aion-ai-os"
version = "0.0.1"
description = "Personal AI operating layer for Claude Code, exposed through MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
aios = "aios.interfaces.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["spikes"]  # throwaway spike scripts; they print by design

[tool.ruff.lint]
# T20 forbids print(): stdout is the MCP protocol channel (see docs/spikes/PHASE1-SPIKES.md, S4).
select = ["E", "F", "I", "UP", "B", "SIM", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Parameter descriptions are text shown to the model; wrapping them mid-sentence helps no one.
"src/aios/interfaces/mcp/tools.py" = ["E501"]
# One-line user-facing messages and option help; wrapping them hurts readability.
"src/aios/interfaces/cli/plan_cmds.py" = ["E501"]
"src/aios/services/plan_render.py" = ["E501"]
"src/aios/services/plan_execution.py" = ["E501"]
"src/aios/domain/seal.py" = ["E501"]
"src/aios/interfaces/mcp/write_tools.py" = ["E501"]
"tests/unit/test_plans.py" = ["E501"]
"tests/unit/test_git_exec.py" = ["E501"]
"tests/unit/test_plan_execution.py" = ["E501"]
"tests/unit/test_plan_seal.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# An exception swallowed inside a helper thread must fail the test, not hide as a warning.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
